# Outlet registry (build plan §8).
#
# tier:     SourceRef tier used by the verifier (official > wire/national > local/community;
#           factcheck contradicts everything else).
# category: which desk the source feeds: official, news, native, factcheck, accountability,
#           sport, pan_african.
# owner:    for independence checks. Two outlets under one owner do not corroborate each other
#           (all BBC services are one owner; Premium Times and its Hausa edition are one owner;
#           ICIR and FactCheckHub are one owner).
# feeds:    RSS/Atom URLs, the primary path. `scrape` is the fallback for sources without a feed.
#
# `uv run python -m src.ingest.registry --verify` checks every feed and scrape target.
# Sources that fail verification are moved to `dropped:` at the end with the reason.

sources:
- id: inec
  outlet: INEC
  homepage: https://inecnigeria.org
  tier: official
  category: official
  region: national
  language: en
  owner: INEC
  feeds: []
  scrape:
    type: html
    url: https://inecnigeria.org/press
    link_pattern: inecnigeria\.org/press/[a-z0-9-]+$
    fields: {}
    dayfirst: false
  robots_ok: true
  verified_on: '2026-09-19'
  method: scrape
