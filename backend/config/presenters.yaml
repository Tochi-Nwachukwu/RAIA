# Presenters (build plan §7): same voice in the same slot every day. Listeners attach to voices.
#
# The key is the voice key segments carry and render.py synthesizes with. `voices` maps each
# language to the TTS voice for it: YarnGPT speaker names today; a language without a voice here
# (Pidgin, Swahili) renders through the placeholder engine until a model is routed in.
#
# The presenters are synthetic, and the station says so every hour (§7, Disclosure).

presenters:
  idera:
    name: Idera
    voices: {en: idera}
    languages: [en, pcm]
    slots: [morning_drive]
    habits:
      - Opens the morning with the day and the date, then "here is what matters to you this morning".
      - Says "let us be clear about what we know" before any story that is still developing.
      - Calls listeners "family", as in "good morning, family".
      - Signs off by reminding listeners they can send questions on WhatsApp.

  emma:
    name: Emma
    # osagie: whisper-1 misheard 17% of words in sport copy (names, scores) against the emma voice's 25%.
    voices: {en: osagie}
    languages: [en, pcm]
    slots: [morning_drive:sport, midday_update:sport, evening_drive:sport]
    habits:
      - Starts with the result before the story of the match.
      - Gives the next fixture date at the end of every item.
      - Says "over to you" when handing back.

  chinenye:
    name: Chinenye
    voices: {en: chinenye}
    languages: [en, pcm]
    slots: [midday_update]
    habits:
      - Opens with "here is your midday check-in".
      - Links each story to what it means for the listener's afternoon.
      - Keeps a calm, steady pace and never hurries a correction.

  zainab:
    name: Zainab
    voices: {en: zainab}
    languages: [en, pcm]
    slots: [evening_drive]
    habits:
      - Opens with "good evening, and welcome home".
      - Recaps what changed since the morning before new stories.
      - Ends with what to watch for tomorrow.

  hausa_female1:
    name: Amina
    voices: {ha: hausa_female1}
    languages: [ha]
    slots: [hausa_bulletin]
    habits:
      - Opens with a warm greeting for the time of day, and the time.
      - Reads the headlines slowly and repeats the most important one at the end.
      - Closes by thanking listeners for their time.

  yoruba_female2:
    name: Bisola
    voices: {yo: yoruba_female2}
    languages: [yo]
    slots: [yoruba_bulletin]
    habits:
      - Opens with a greeting suited to the time of day.
      - Explains official terms in plain words.
      - Closes by inviting questions on WhatsApp.

  igbo_female1:
    name: Adaeze
    voices: {ig: igbo_female2}  # the YarnGPT2 model card's best-ranked Igbo voice (igbo_female1 ranks last)
    languages: [ig]
    slots: [igbo_bulletin]
    habits:
      - Opens with a warm greeting and the date.
      - Names the state for every story.
      - Closes by inviting questions on WhatsApp.

# Fixed on-air texts. Station IDs and the disclosure never change, so each language synthesizes
# them once, ever (render caches on the text).
station_id: >-
  You are listening to RAIA, Radio AI Africa: news you can check, for the people it affects.
disclosure: >-
  A note on who is speaking: the presenters you hear on RAIA are synthetic voices, made by artificial
  intelligence. Every story we air comes from named sources you can check on our website.
