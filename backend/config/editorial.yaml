# Editorial rules (build plan §9). Enforced by the editor, vetoed by the safety gate.
# A system that has thought about when *not* to broadcast is a serious system.

always:
- Attribute claims. "The minister said X", never "X".
- Never air an unverified casualty figure.
- Never attribute blame to an ethnic or religious group in an unverified incident.
- Never name a suspect who has not been charged.
- Anything sensitive requires human review before synthesis. No exceptions, no override flag.
- If corroboration fails, the station says so on air.

# Said on air, verbatim, whenever a story rests on a single outlet.
single_source_disclaimer: >-
  We have seen this reported by one outlet only and have not been able to confirm it.

election:
  rules:
  - Never project, call, or speculate on a result.
  - Results, turnout and registration figures come from INEC (official tier) only.
  - Campaign claims are attributed, never corroborated. A party saying a thing is evidence the party said it, 
    nothing more.
  - Track airtime by party across each block and log it. Imbalance is a bug.
  - No personal attacks on candidates. No ethnic or religious framing of candidates.
  - Violence at a campaign event is sensitive and goes to human review.
  - Voter education is the backbone and is always safe to air.
  parties: [APC, PDP, LP, NNPP, ADC, APGA, SDP, YPP, ADP, PRP, AA, ZLP, NDC]
  # Airtime share above which one party's lead over the next is logged as an imbalance.
  imbalance_ratio: 2.0

# Facts the desk treats as settled. A source that disagrees loses, and the contradiction is logged
# (this is how Test Case #1 catches articles that still carry INEC's superseded dates).
# `source_verified` says whether the pipeline confirmed the source page itself; seeds from the
# build plan that no page has confirmed yet are used for context, never to overrule a source.
