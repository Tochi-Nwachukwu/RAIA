# Voter education: always safe to air. Each line is read on air only while `uv run python -m
# src.editorial --verify` finds its `check` phrases on the INEC page it cites.
voter_education:
- text: >-
    INEC's voter registration and PVC portal lets you check your registration status, find where to
    collect your Permanent Voter Card, and register online.
  source_url: https://inecnigeria.org
  check: ["Verify registration status", "PVC collection centers", "register online"]
  verified_on:
- text: >-
    INEC's Citizens Contact Centre answers voters on the short code four six three two, from nine in the
    morning to five in the evening on weekdays, and around the clock on election days.
  source_url: https://inecnigeria.org/contact
  check: ["4632", "9:00 AM - 5:00 PM", "24/7 on Election Days"]
  verified_on: '2026-09-19'
- text: >-
    The presidential and National Assembly elections hold on Saturday the sixteenth of January, twenty
    twenty-seven. Governorship and State Assembly elections follow on Saturday the sixth of February.
  source_url: https://inecnigeria.org/elections/calendar
  check: ["January 16, 2027", "February 6, 2027"]
  verified_on: '2026-09-19'
